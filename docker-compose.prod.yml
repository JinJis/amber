# Production override — single GCE VM (32GB), Cloudflare → Caddy → web. See docs/INFRA.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What this changes vs the dev compose:
#   * Caddy terminates TLS on :80/:443 (Cloudflare Origin CA cert) and reverse-proxies web:3000.
#   * Every API port is re-bound to 127.0.0.1 (defense-in-depth under the GCP firewall) —
#     containers still talk over the compose network; only Caddy is world-reachable.
#   * mem_limit per service so one runaway container can't OOM the whole VM (ME-13).
#     Defaults budget a 32GB host: pg 14g · worker 3g · rag 2.5g · datasets 2g · agent 1.5g ·
#     web 1.5g · cp/studio/admin 1g · caddy 512m ≈ 29.5g + OS ~2g (8GB swapfile as spike buffer).
#     STARTER (16GB e2-standard-4) — override via shell/root .env (docs/INFRA.md §2):
#       VG_MEM_PG=8g VG_MEM_WORKER=2g VG_MEM_RAG=1.5g VG_MEM_DATASETS=1.5g
#     (tradeoff: less page cache for the HNSW index → colder vector queries; fine for first users)
#   * stop_grace_period on studio-api/agent-engine — SIGTERM lets in-flight SSE turns (~45s)
#     finish before the swap kills them (deploy/deploy.sh rolling update).
#   * worker healthcheck (procrastinate) — a silently-wedged worker now flips unhealthy.
#   * web build receives NEXT_PUBLIC_TOSS_CLIENT_KEY (inlined at `npm run build`).
#
# Reminder: set ENV=production in env/app.env and fill env/secrets.env first — services REFUSE
# to boot on dev-default secrets (SC-0). DOMAIN comes from the shell or a root .env (compose
# ${...} interpolation does not read env/*.env).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN=your.domain on the shell or in a root .env}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./secrets/origin-cert:/certs:ro   # Cloudflare Origin CA cert + key (gitignored)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    image: ${VG_REGISTRY_PREFIX:-}valuegraph-web:${VG_TAG:-latest}
    build:
      context: ./web
      args:
        # NEXT_PUBLIC_* is inlined at build time — pass it here (shell or root .env), NOT env/*.env.
        NEXT_PUBLIC_TOSS_CLIENT_KEY: "${NEXT_PUBLIC_TOSS_CLIENT_KEY:-}"
    ports: !override
      - "127.0.0.1:3000:3000"
    mem_limit: ${VG_MEM_WEB:-1.5g}
    stop_grace_period: 15s
    healthcheck:   # deploy.sh의 --wait 게이트용 (busybox wget은 alpine 기본)
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  datasets:
    image: ${VG_REGISTRY_PREFIX:-}valuegraph-datasets:${VG_TAG:-latest}
    ports: !override
      - "127.0.0.1:8000:8000"
    mem_limit: ${VG_MEM_DATASETS:-2g}

  worker:
    image: ${VG_REGISTRY_PREFIX:-}valuegraph-datasets:${VG_TAG:-latest}
    mem_limit: ${VG_MEM_WORKER:-3g}
    healthcheck:
      test: ["CMD", "python", "-m", "procrastinate", "--app=app.queue.app", "healthchecks"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  control-plane:
    image: ${VG_REGISTRY_PREFIX:-}valuegraph-control-plane:${VG_TAG:-latest}
    ports: !override
      - "127.0.0.1:8010:8001"
    mem_limit: 1g

  rag:
    image: ${VG_REGISTRY_PREFIX:-}valuegraph-rag:${VG_TAG:-latest}
    ports: !override
      - "127.0.0.1:8002:8002"
    mem_limit: ${VG_MEM_RAG:-2.5g}

  agent-engine:
    image: ${VG_REGISTRY_PREFIX:-}valuegraph-agent-engine:${VG_TAG:-latest}
    ports: !override
      - "127.0.0.1:8003:8003"
    mem_limit: ${VG_MEM_AGENT:-1.5g}
    stop_grace_period: 45s

  studio-api:
    image: ${VG_REGISTRY_PREFIX:-}valuegraph-studio-api:${VG_TAG:-latest}
    ports: !override
      - "127.0.0.1:8004:8004"
    mem_limit: 1g
    stop_grace_period: 45s

  admin:
    # Force loopback in production REGARDLESS of ADMIN_BIND (a dev .env may set 0.0.0.0).
    # Access via IAP SSH tunnel:  gcloud compute ssh vg-beta --tunnel-through-iap -- -L 8005:127.0.0.1:8005
    image: ${VG_REGISTRY_PREFIX:-}valuegraph-admin:${VG_TAG:-latest}
    ports: !override
      - "127.0.0.1:8005:8005"
    mem_limit: 1g
    healthcheck:   # /healthz는 인증 없이 열려 있음 (admin/tests/test_admin.py)
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8005/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    # 14g leaves room for shared_buffers(2g) + backends + the host page cache holding the
    # ~8.4GB HNSW index (cgroup v2 attributes page cache to the container). Starter(16GB): 8g.
    mem_limit: ${VG_MEM_PG:-14g}

volumes:
  caddy_data: {}
  caddy_config: {}
