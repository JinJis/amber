# Whole platform, one command:  docker compose up --build
# Config is split into env/*.env by topic (see env/README.md) — copy the *.example
# templates or run `bash scripts/split_env.sh`. A single root .env still works too
# (every env_file is optional; later files override earlier).
name: valuegraph-platform

# SC-0.4: cap every container's json-file logs so a chatty/looping service can't fill the host
# disk (logs share the disk with Postgres). 10 MB x 5 rotated files per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  datasets:
    logging: *default-logging
    build: ./datasets
    image: valuegraph-datasets:latest
    env_file:
      # split config by topic (env/README.md) — all optional, later files override earlier, missing
      # ones skipped. These are env_file (injected INTO the container); compose ${...} interpolation
      # (e.g. the admin host port) does NOT read them — that's shell/CLI only.
      - path: env/app.env
        required: false
      - path: env/gemini.env
        required: false
      - path: env/data-keys.env
        required: false
      - path: env/auth-billing.env
        required: false
      - path: env/secrets.env
        required: false
    environment:
      DATABASE_URL: "postgresql+psycopg://rag:rag@postgres:5432/datasets"
      GOOGLE_APPLICATION_CREDENTIALS: "/secrets/gcp-sa.json"   # Document AI (deck parsing)
    volumes:
      - datasets_data:/data   # evidence-HTML cache (/data/evidence_docs); the store is Postgres
      - ./secrets:/secrets:ro   # gcp service-account JSON (gitignored) — shared with the worker/rag
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Procrastinate worker — runs the per-pipeline cron sweeps (app/queue.py @app.periodic) and
  # processes the deferred ingestion jobs with retries. The broker IS Postgres (no Redis). The
  # datasets web process applies the queue schema at startup; this just runs the worker. Stop it
  # (`docker compose stop worker`) to pause all automatic ingestion.
  worker:
    logging: *default-logging
    build: ./datasets
    image: valuegraph-datasets:latest
    env_file:
      # split config by topic (env/README.md) — all optional, later files override earlier, missing
      # ones skipped. These are env_file (injected INTO the container); compose ${...} interpolation
      # (e.g. the admin host port) does NOT read them — that's shell/CLI only.
      - path: env/app.env
        required: false
      - path: env/gemini.env
        required: false
      - path: env/data-keys.env
        required: false
      - path: env/auth-billing.env
        required: false
      - path: env/secrets.env
        required: false
    environment:
      DATABASE_URL: "postgresql+psycopg://rag:rag@postgres:5432/datasets"
      RAG_URL: "http://rag:8002"
      GOOGLE_APPLICATION_CREDENTIALS: "/secrets/gcp-sa.json"   # Document AI (deck parsing)
    volumes:
      # Share the datasets data volume: filing ingest warms the evidence-HTML cache
      # (get_filing_html). Without this mount the cache written during ingestion lands in
      # the worker's own ephemeral FS, so every /evidence/html view re-fetched upstream —
      # and KR previews died whenever the OpenDART daily quota was already spent.
      - datasets_data:/data
      - ./secrets:/secrets:ro   # gcp service-account JSON (gitignored)
    command: ["python", "-m", "procrastinate", "--app=app.queue.app", "worker", "--concurrency=4", "--queues=ingest,sweep"]
    depends_on:
      datasets:
        condition: service_healthy
      rag:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  control-plane:
    logging: *default-logging
    build: ./control-plane
    image: valuegraph-control-plane:latest
    env_file:
      # split config by topic (env/README.md) — all optional, later files override earlier, missing
      # ones skipped. These are env_file (injected INTO the container); compose ${...} interpolation
      # (e.g. the admin host port) does NOT read them — that's shell/CLI only.
      - path: env/app.env
        required: false
      - path: env/gemini.env
        required: false
      - path: env/data-keys.env
        required: false
      - path: env/auth-billing.env
        required: false
      - path: env/secrets.env
        required: false
    environment:
      # In the compose network backend services are reachable by name.
      DATASETS_URL: "http://datasets:8000"
      RAG_URL: "http://rag:8002"
      DATABASE_URL: "postgresql+psycopg://rag:rag@postgres:5432/controlplane"
    ports:
      # host 8010 -> container 8001 (host 8001 is often taken)
      - "8010:8001"
    depends_on:
      datasets:
        condition: service_healthy
      rag:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # MCP server. Not part of the default stack (stdio); `tools` profile so e2e can
  # run it as a one-off on the network: `docker compose run --rm -T mcp python ...`.
  mcp:
    logging: *default-logging
    build: ./mcp
    image: valuegraph-mcp:latest
    profiles: ["tools"]
    env_file:
      # split config by topic (env/README.md) — all optional, later files override earlier, missing
      # ones skipped. These are env_file (injected INTO the container); compose ${...} interpolation
      # (e.g. the admin host port) does NOT read them — that's shell/CLI only.
      - path: env/app.env
        required: false
      - path: env/gemini.env
        required: false
      - path: env/data-keys.env
        required: false
      - path: env/auth-billing.env
        required: false
      - path: env/secrets.env
        required: false
    environment:
      MCP_GATEWAY_URL: "http://control-plane:8001"

  # SC-2.4: optional shared-state store for horizontal scaling. Off by default (profile "scale") —
  # the stack is single-node correct without it. Bring it up only when running >1 replica AND set
  # REDIS_URL=redis://redis:6379/0 (env/app.env):  docker compose --profile scale up -d redis
  redis:
    logging: *default-logging
    image: redis:7-alpine
    profiles: ["scale"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]   # ephemeral cache — no persistence, LRU evict
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    logging: *default-logging
    image: pgvector/pgvector:pg16   # Postgres + pgvector preinstalled
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    # ING-1: the pgvector default shared_buffers (128MB) can't cache the HNSW index (6.5GB on the
    # ~870k-row corpus), so every vector insert reads graph pages from disk (~2s/row cold) — the
    # real bottleneck behind the large-filing ingest stall. Give Postgres enough cache to hold the
    # hot index. Sized for a ~16GB+ host; drop these if running on a smaller box.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=8GB"
      - "-c"
      - "maintenance_work_mem=512MB"
    shm_size: "2gb"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rag:
    logging: *default-logging
    build: ./rag
    image: valuegraph-rag:latest
    env_file:
      # split config by topic (env/README.md) — all optional, later files override earlier, missing
      # ones skipped. These are env_file (injected INTO the container); compose ${...} interpolation
      # (e.g. the admin host port) does NOT read them — that's shell/CLI only.
      - path: env/app.env
        required: false
      - path: env/gemini.env
        required: false
      - path: env/data-keys.env
        required: false
      - path: env/auth-billing.env
        required: false
      - path: env/secrets.env
        required: false
    environment:
      # Embeddings + dim come from .env (RAG_EMBEDDING_MODEL=gemini-embedding-2). The vector store
      # is pgvector (RAG_VECTOR_STORE=pgvector in .env) backed by the postgres service below.
      RAG_DATABASE_URL: "postgresql://rag:rag@postgres:5432/rag"
      # gcp Vertex Ranking reranker (optional): drop a service-account JSON at ./secrets/gcp-sa.json,
      # then in .env set RAG_RERANKER_BACKEND=gcp + RAG_GCP_PROJECT. Unused while reranker=none.
      GOOGLE_APPLICATION_CREDENTIALS: "/secrets/gcp-sa.json"
    volumes:
      - ./secrets:/secrets:ro   # holds the gcp service-account JSON (gitignored)
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  agent-engine:
    logging: *default-logging
    build: ./agent-engine
    image: valuegraph-agent-engine:latest
    env_file:
      # split config by topic (env/README.md) — all optional, later files override earlier, missing
      # ones skipped. These are env_file (injected INTO the container); compose ${...} interpolation
      # (e.g. the admin host port) does NOT read them — that's shell/CLI only.
      - path: env/app.env
        required: false
      - path: env/gemini.env
        required: false
      - path: env/data-keys.env
        required: false
      - path: env/auth-billing.env
        required: false
      - path: env/secrets.env
        required: false
    environment:
      AGENT_GATEWAY_URL: "http://control-plane:8001"   # compose-internal service URL (literal)
      # AGENT_LLM_BACKEND · AGENT_MODEL come from env/app.env; GOOGLE_API_KEY from env/gemini.env —
      # all via env_file now (no ${...} interpolation, so nothing depends on a root .env / shell).
      # (These were previously interpolated with :- defaults, which SILENTLY OVERRODE the env_file
      # value to "" when unset in the shell — a latent key-blanking bug, now removed.)
    ports:
      - "8003:8003"
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8003/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  studio-api:
    logging: *default-logging
    build: ./studio-api
    image: valuegraph-studio-api:latest
    env_file:
      # split config by topic (env/README.md) — all optional, later files override earlier, missing
      # ones skipped. These are env_file (injected INTO the container); compose ${...} interpolation
      # (e.g. the admin host port) does NOT read them — that's shell/CLI only.
      - path: env/app.env
        required: false
      - path: env/gemini.env
        required: false
      - path: env/data-keys.env
        required: false
      - path: env/auth-billing.env
        required: false
      - path: env/secrets.env
        required: false
    environment:
      CONTROL_PLANE_URL: "http://control-plane:8001"
      AGENT_ENGINE_URL: "http://agent-engine:8003"
      DATABASE_URL: "postgresql+psycopg://rag:rag@postgres:5432/studio"
    ports:
      - "8004:8004"
    depends_on:
      control-plane:
        condition: service_healthy
      agent-engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8004/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Web UI — part of the default stack: `docker compose up` serves it on :3000.
  # (The e2e script brings up only the backend services by name, so it stays fast.)
  web:
    logging: *default-logging
    build: ./web
    image: valuegraph-web:latest
    env_file:
      # split config by topic (env/README.md) — all optional, later files override earlier, missing
      # ones skipped. These are env_file (injected INTO the container); compose ${...} interpolation
      # (e.g. the admin host port) does NOT read them — that's shell/CLI only.
      - path: env/app.env
        required: false
      - path: env/gemini.env
        required: false
      - path: env/data-keys.env
        required: false
      - path: env/auth-billing.env
        required: false
      - path: env/secrets.env
        required: false
    environment:
      STUDIO_API_URL: "http://studio-api:8004"
    ports:
      - "3000:3000"
    depends_on:
      studio-api:
        condition: service_healthy
    restart: unless-stopped

  # Admin panel — Django-admin-style CRUD over every service DB (reflected over Postgres) +
  # an ops console. Login via ADMINUI_USERNAME/ADMINUI_PASSWORD.
  admin:
    logging: *default-logging
    build: ./admin
    image: valuegraph-admin:latest
    env_file:
      # split config by topic (env/README.md) — all optional, later files override earlier, missing
      # ones skipped. These are env_file (injected INTO the container); compose ${...} interpolation
      # (e.g. the admin host port) does NOT read them — that's shell/CLI only.
      - path: env/app.env
        required: false
      - path: env/gemini.env
        required: false
      - path: env/data-keys.env
        required: false
      - path: env/auth-billing.env
        required: false
      - path: env/secrets.env
        required: false
    environment:
      # ADMINUI_USERNAME · ADMINUI_PASSWORD · ADMINUI_IP_ALLOWLIST come from env/secrets.env
      # (env_file) now — not ${...} interpolation, so no root .env dependency.
      # browse the service DBs over Postgres (no more mounted SQLite files)
      CONTROLPLANE_DB: "postgresql+psycopg://rag:rag@postgres:5432/controlplane"
      STUDIO_DB: "postgresql+psycopg://rag:rag@postgres:5432/studio"
      DATASETS_DB: "postgresql+psycopg://rag:rag@postgres:5432/datasets"
    ports:
      # SC-0.2/CR-10: loopback by default — this console has CRUD over every service DB, so it must
      # not sit on 0.0.0.0. This host port publish is the ONE thing docker can't take from env_file
      # (it's compose-level, not a container var). To expose it, pass ADMIN_BIND on the command line:
      #     ADMIN_BIND=0.0.0.0 docker compose up -d admin
      # then gate it at your cloud firewall + ADMINUI_IP_ALLOWLIST + a strong ADMINUI_PASSWORD.
      # (Want it always-on for your deployment? change the default here to  ${ADMIN_BIND:-0.0.0.0} .)
      - "${ADMIN_BIND:-127.0.0.1}:8005:8005"
    depends_on:
      control-plane:
        condition: service_healthy
      studio-api:
        condition: service_healthy
      datasets:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datasets_data: {}
  pg_data: {}
